[project]
name = "qnsim"
version = "0.0.1"
description = "Quantum noisy simulator (MVP Phase 1)"
requires-python = ">=3.13"
dependencies = ["numpy>=2.0", "loky>=3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qnsim"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
