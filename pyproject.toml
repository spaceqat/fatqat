[project]
name = "fatqat"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "FatQat contributors"}]
keywords = [
    "quantum computing",
    "quantum simulation",
    "quantum circuits",
    "quantum noise",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "numba>=0.59",
    "loky>=3.0.0",
    "qutip>=5.1,<6",
    "qutip-qip>=0.4,<0.5",
    "matplotlib>=3.8",
    "scipy>=1.12,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fatqat"]

[tool.hatch.version]
path = "src/fatqat/__init__.py"

[dependency-groups]
dev = ["pytest>=8", "scipy-doctest>=1.0"]
# Optional: enables the Qiskit integration and numerical cross-check tests in
# the full-dependency Ubuntu lane. Never required by the package itself; those
# modules self-skip when Qiskit or Qiskit Aer is absent.
qiskit = ["qiskit>=1.0", "qiskit-aer>=0.17"]
# Complete test environment for one reference CI lane. Add future optional
# integration groups here so the full suite and installed-package doctests
# collect every supported extension without burdening the platform matrix.
test-full = [
    {include-group = "dev"},
    {include-group = "qiskit"},
]
# Formatting (black) and static analysis (pylint). Used by the Lint CI workflow;
# configuration lives in [tool.black] and [tool.pylint].
lint = ["black>=24", "pylint>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.black]
line-length = 88
target-version = ["py312", "py313"]

[tool.pylint.main]
py-version = "3.12"
jobs = 0  # 0 = one process per available CPU core

[tool.pylint.format]
max-line-length = 88

[tool.pylint.basic]
# This library exposes gate singletons as module-level names spelled after the
# gates themselves (Sdg, iSwap, InverseFourier, Reset, Barrier, ...) plus the conftest
# hook `pytest_plugins`; none fit UPPER_CASE, so accept any constant name.
const-naming-style = "any"
# `iSwapGate` intentionally leads with a lowercase 'i' (the canonical gate name).
good-names = ["i", "j", "k", "ex", "Run", "_", "iSwapGate"]

[tool.pylint."messages control"]
# Pragmatic gate: black owns formatting and the checks below flag deliberate,
# documented patterns in this codebase rather than defects. Everything else
# (real errors, unused names, undefined vars, bad returns, ...) stays enabled.
disable = [
    "line-too-long",                 # black owns line length
    "duplicate-code",                # small test setups legitimately repeat similar lines
    "missing-module-docstring",      # docstrings are placed by intent, not blanket-required
    "missing-class-docstring",
    "missing-function-docstring",    # test functions read as their own names
    "protected-access",              # white-box tests use package-internal _names by design
    "import-outside-toplevel",       # deliberate lazy imports break import cycles
    "unidiomatic-typecheck",         # `type(x) is int` is an intentional exact-type guard
    "unused-argument",               # args accepted for interface parity (e.g. rng on DM reset)
    "too-few-public-methods",        # frozen value objects / dataclasses
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-instance-attributes",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-statements",
    "too-many-boolean-expressions",
    "too-many-lines",
    # pylint's static inference is unreliable on numpy arrays and on the
    # deliberate "assert this misuse raises" test patterns (calling a gate
    # singleton, mutating an immutable tuple view, capturing a None return),
    # so these inference checks misfire here. pyright and the test suite cover
    # the genuine cases.
    "no-member",
    "not-callable",
    "assignment-from-no-return",
    "too-many-function-args",
    "unexpected-keyword-arg",
    "unbalanced-tuple-unpacking",    # qasm `_lower` returns variable-length tuples by kind
    "pointless-statement",           # bare `obj[i]` inside pytest.raises is the test action
    # run() intentionally captures any execution-stage error into a failed Job.
    "broad-exception-caught",
    # Opinionated style that conflicts with intentional choices here.
    "use-implicit-booleaness-not-comparison",  # explicit `== ()` / `== {}` in tests
    "consider-using-from-import",
]
