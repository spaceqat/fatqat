[project]
name = "fatqat"
version = "0.0.1"
description = "Quantum noisy simulator (MVP Phase 1)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.23.2", "loky>=3.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fatqat"]

[dependency-groups]
dev = ["pytest>=8", "scipy-doctest>=1.0"]
docs = ["sphinx", "pydata-sphinx-theme", "myst-parser", "sphinx-design", "sphinx-copybutton"]
# Optional: enables the Numba statevector engine (fatqat.backends.statevector_numba)
# and its tests. Not required by the base package. Note: numba currently pins
# numpy < 2.5, so `uv sync --group numba` may downgrade numpy.
numba = ["numba>=0.66"]

[tool.pytest.ini_options]
testpaths = ["tests"]
