index:
  en:
    title: Tutorials
    description: Executable FatQat case studies in circuits, control, error correction, simulation, optimization, and machine learning.
    introduction: >-
      Explore complete, executable case studies grouped by topic. If you are new
      to FatQat, start with the [quickstart](../guide/quickstart.md) to learn how
      to build, run, and inspect a program.
    tip_title: Choose a path
    tip: >-
      Follow [eight-atom GHZ preparation](atom-array-ghz8.md) with
      [atom-loss error correction](atom-loss-erasure.md), or move from
      [gate calibration](pulse-calibration.md) to
      [Rydberg CZ pulse design](optimal-cz-control.md). For optimization, work
      through [QUBO and QAOA](qubo-qaoa.md),
      [the islanding model](islanding-model.md), and
      [islanding with QAOA](islanding-qaoa.md).
    open: Open tutorial

# Change this list to choose the gallery order. Unlisted folders follow alphabetically.
category_order:
  - circuits-and-entanglement
  - error-correction
  - quantum-simulation
  - combinatorial-optimization
  - quantum-machine-learning
  - pulse-control

categories:
  circuits-and-entanglement:
    en:
      title: Circuits and entanglement
      description: >-
        Construct and verify quantum gates and entangled states using mixed
        qubit-qutrit registers and reconfigurable atom-array connectivity.
  error-correction:
    en:
      title: Error correction
      description: >-
        Study repetition-code and surface-code memories, parity checks, and
        decoding with syndrome histories or information about atom loss.
  quantum-simulation:
    en:
      title: Quantum simulation
      description: >-
        Estimate molecular ground-state energies and explore correlations,
        revivals, and entanglement in interacting quantum systems.
  combinatorial-optimization:
    en:
      title: Combinatorial optimization
      description: >-
        Encode constraints as QUBOs, solve them with QAOA, and apply the workflow
        to controlled power-grid islanding.
  quantum-machine-learning:
    en:
      title: Quantum machine learning
      description: >-
        Train parameterized circuits and search circuit structures for
        classification and regression with batched parameter sweeps.
  pulse-control:
    en:
      title: Pulse control and calibration
      description: >-
        Design and calibrate control pulses, then check their action on quantum
        states in transmon and Rydberg models.
