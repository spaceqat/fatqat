    default_category_description: Tutorials collected from the {title} source folder.

index:
  en:
    title: Tutorials
    description: Executable FatQat case studies, from first circuits to many-body dynamics.
    introduction: >-
      Go beyond the task-focused user guide with complete, executable case studies.
      Every card and runtime panel is discovered from the Markdown sources in its
      category folder.
    tip_title: Choose a path
    tip: >-
      Begin with the Bell state if you are new to FatQat. The algorithms reuse the
      same execution model, while the neutral-atom track moves progressively closer
      to many-body hardware physics.
    open: Open tutorial

# Change this list to choose the gallery order. Unlisted folders follow alphabetically.
category_order:
  - foundations
  - algorithms
  - optimization
  - neutral-atom-physics
  - power-systems

categories:
  foundations:
    en:
      title: Foundations
      description: >-
        Start with a compact circuit whose state, samples, and visual interpretation
        can all be checked by hand.
  algorithms:
    en:
      title: Algorithms
      description: >-
        Use parameterized programs, optimizers, sweeps, and estimators to answer
        chemistry and machine-learning questions.
  optimization:
    en:
      title: Optimization
      description: >-
        Model a constrained combinatorial problem as a QUBO, map it onto a
        Hamiltonian, and solve it variationally.
  neutral-atom-physics:
    en:
      title: Neutral-atom physics
      description: >-
        Move from programmable connectivity to continuous-time Rydberg dynamics and
        constrained many-body evolution.
  power-systems:
    en:
      title: Power systems
      description: >-
        Apply the QUBO and QAOA machinery to grid operation problems, where the
        encoding decides whether a network fits on the device at all.
