<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 290">
  <title>From gate or pulse to physical evolution</title>
  <desc>A Program gate supplies calibrated controls, and a PulseOperation supplies explicit controls. Both feed into the physical schedule, which drives Hamiltonian or Lindblad evolution.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 8 4 0 8Z" fill="#506d7a"/>
    </marker>
  </defs>
  <rect width="544" height="290" rx="12" fill="#f5f8fa"/>
  <g stroke="#506d7a" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M152 62V86"/>
    <path d="M392 62V86"/>
    <path d="M152 126v14q0 8 8 8h68q8 0 8 8v12"/>
    <path d="M392 126v14q0 8-8 8h-68q-8 0-8 8v12"/>
    <path d="M272 208v24"/>
  </g>
  <g fill="#fff" stroke="#b4c5ce">
    <rect x="48" y="22" width="208" height="40" rx="7"/>
    <rect x="288" y="22" width="208" height="40" rx="7"/>
    <rect x="48" y="86" width="208" height="40" rx="7"/>
    <rect x="288" y="86" width="208" height="40" rx="7"/>
  </g>
  <rect x="150" y="168" width="244" height="40" rx="7" fill="#e0f0f2" stroke="#44818b"/>
  <rect x="92" y="232" width="360" height="40" rx="7" fill="#fff" stroke="#b4c5ce"/>
  <g fill="#213742" font-family="sans-serif" font-size="17" text-anchor="middle">
    <text x="152" y="48">Program gate</text>
    <text x="392" y="48" font-family="monospace">PulseOperation</text>
    <text x="152" y="112">Calibrated controls</text>
    <text x="392" y="112">Explicit controls</text>
    <text x="272" y="194" font-weight="600">Physical schedule</text>
    <text x="272" y="258">Hamiltonian / Lindblad evolution</text>
  </g>
</svg>
