name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.12"
          enable-cache: true

      # numba (the optional `numba` group) is installed so pylint can resolve
      # `fatqat.simulator.nb`'s numba imports; without it pylint reports an
      # import-error. `--group numba` is passed to `uv run` too, or it would
      # re-sync without the group and drop numba (as in tests.yml).
      - name: Install dependencies (with lint tools and numba)
        run: uv sync --group lint --group numba

      - name: Check formatting (black)
        run: uv run --group lint --group numba black --check --diff src tests conftest.py

      - name: Static analysis (pylint)
        run: uv run --group lint --group numba pylint src/fatqat tests conftest.py
