name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group dev --group lint --group qiskit

      - name: Check formatting (black)
        run: python -m black --check --diff src tests conftest.py

      - name: Static analysis (pylint)
        run: python -m pylint src/fatqat tests conftest.py
