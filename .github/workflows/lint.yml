name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify generated documentation is not tracked
        run: |
          tracked_generated="$(git ls-files -- \
            ':(glob)docs/mkdocs/*/assets/generated/**' \
            ':(glob)docs/mkdocs/*/downloads/tutorials/**' \
            ':(glob)docs/mkdocs/*/tutorials/**' \
            docs/mkdocs/tutorial-results)"
          if [ -n "$tracked_generated" ]; then
            printf 'Generated documentation files must not be tracked:\n%s\n' "$tracked_generated"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group dev --group lint --group qiskit

      - name: Check formatting (black)
        run: python -m black --check --diff src tests conftest.py

      - name: Static analysis (pylint)
        run: python -m pylint src/fatqat tests conftest.py
