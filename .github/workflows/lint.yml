name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.12"
          enable-cache: true

      # The optional groups (numba, qiskit, draw) are installed so pylint can
      # resolve their imports (e.g. `fatqat.simulator.nb`'s numba,
      # `fatqat.draw`'s qutip-qip); without them pylint reports import-errors.
      # The groups are passed to `uv run` too, or it would re-sync without them
      # and drop the packages (as in tests.yml).
      - name: Install dependencies (with lint tools and optional groups)
        run: uv sync --group lint --group numba --group qiskit --group draw

      - name: Check formatting (black)
        run: uv run --group lint --group numba --group qiskit --group draw black --check --diff src tests conftest.py

      - name: Static analysis (pylint)
        run: uv run --group lint --group numba --group qiskit --group draw pylint src/fatqat tests conftest.py
