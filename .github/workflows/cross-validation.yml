name: Cross-validation against Qiskit

# Numerical cross-validation against Qiskit Aer: small circuits, ideal and
# noisy, compared as exact state matrices (atol 1e-12), on both runtimes
# (numpy and numba). One Linux job is enough - this checks numbers, not
# platforms. Intended as a required check: it runs on every PR and on every
# push to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-against-qiskit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.12"
          enable-cache: true

      # The groups on `uv run` too, or it would re-sync the environment
      # without them and drop qiskit-aer/numba (as in tests.yml's numba job).
      - name: Install dependencies (with qiskit-aer and numba)
        run: uv sync --group qiskit --group numba

      # The numba axis SKIPS when numba is missing (correct locally); CI must
      # fail loudly instead of going green on a silently absent install.
      - name: Guard against silently missing optional dependencies
        run: uv run --group qiskit --group numba python -c "import numba, qiskit_aer"

      # -rs surfaces every skip in the log, so an unexpected one is visible.
      - name: Run the cross-validation suite (numpy and numba runtimes)
        run: uv run --group qiskit --group numba pytest tests/test_against_qiskit.py -v -rs
