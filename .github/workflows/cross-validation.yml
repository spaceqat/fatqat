name: Cross-validation against Qiskit

# Numerical cross-validation against Qiskit Aer: small circuits, ideal and
# noisy, compared as exact state matrices (atol 1e-12), on both runtimes
# (numpy and numba). One Linux job is enough - this checks numbers, not
# platforms. Intended as a required check: it runs on every PR and on every
# push to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-against-qiskit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group dev --group qiskit

      - name: Run the Qiskit integration and cross-validation suites
        run: >-
          python -m pytest
          tests/test_qiskit_integration.py
          tests/test_against_qiskit.py
          -v
