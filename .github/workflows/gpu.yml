
name: GPU Tests

on:
  workflow_dispatch:

permissions:
  contents: read

# Only one workflow in this repository may control the instance at a time.
concurrency:
  group: fatqat-hai-gpu
  cancel-in-progress: false
  queue: max

jobs:
  start-gpu:
    name: Start HAI GPU
    runs-on: ubuntu-latest
    timeout-minutes: 145

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Tencent Cloud SDK
        run: |
          python -m pip install \
            "tencentcloud-sdk-python-common==3.1.121" \
            "tencentcloud-sdk-python-hai==3.1.121"

      - name: Start instance and wait for runner
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          HAI_REGION: ${{ vars.HAI_REGION }}
          HAI_INSTANCE_ID: ${{ vars.HAI_INSTANCE_ID }}
          HAI_RUNNER_NAME: ${{ vars.HAI_RUNNER_NAME }}
          GH_RUNNER_READ_TOKEN: ${{ secrets.GH_RUNNER_READ_TOKEN }}
        run: python -u .github/scripts/hai_power.py start

  gpu-tests:
    name: CuPy GPU smoke test
    needs: start-gpu
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 10
    env:
      CUDA_PATH: /usr/local/cuda-12.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify CUDA before pytest
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$CUDA_PATH/bin:$PATH"
          export LD_LIBRARY_PATH="$CUDA_PATH/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          PYTHON="$HOME/fatqat-ci-venv/bin/python"

          "$PYTHON" --version
          nvidia-smi

          "$PYTHON" - <<'PY'
          import cupy as cp

          cp.show_config()
          device_count = cp.cuda.runtime.getDeviceCount()
          if device_count < 1:
              raise RuntimeError("GPU CI requires an available CUDA GPU")

          with cp.cuda.Device(0):
              probe = cp.asarray([1.0, 2.0, 3.0], dtype=cp.float32)
              result_gpu = probe + 1.0
              cp.cuda.get_current_stream().synchronize()
              result = result_gpu.get().tolist()

          if result != [2.0, 3.0, 4.0]:
              raise RuntimeError(f"CUDA preflight returned an incorrect result: {result}")

          print(f"CUDA_PREFLIGHT_PASSED: {device_count} device(s)")
          PY

      - name: Run GPU tests only
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$CUDA_PATH/bin:$PATH"
          export LD_LIBRARY_PATH="$CUDA_PATH/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          PYTHON="$HOME/fatqat-ci-venv/bin/python"

          "$PYTHON" -m pytest tests/gpu_tests --confcutdir=tests/gpu_tests -v -rs

  stop-gpu:
    name: Stop HAI GPU
    needs: [start-gpu, gpu-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Tencent Cloud SDK
        run: |
          python -m pip install \
            "tencentcloud-sdk-python-common==3.1.121" \
            "tencentcloud-sdk-python-hai==3.1.121"

      - name: Stop GPU and verify state
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          HAI_REGION: ${{ vars.HAI_REGION }}
          HAI_INSTANCE_ID: ${{ vars.HAI_INSTANCE_ID }}
        run: python -u .github/scripts/hai_power.py stop