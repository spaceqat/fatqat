name: GPU Tests

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions: {}

# Manual and PR runs share the existing single HAI instance.
concurrency:
  group: fatqat-hai-gpu
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Select PR revision and GPU need
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      ready: ${{ steps.select.outputs.ready }}
      mode: ${{ steps.select.outputs.mode }}
      head_sha: ${{ steps.select.outputs.head_sha }}
      base_sha: ${{ steps.select.outputs.base_sha }}
      merge_sha: ${{ steps.select.outputs.merge_sha }}
      pr_number: ${{ steps.select.outputs.pr_number }}
      needs_gpu: ${{ steps.select.outputs.needs_gpu }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Select revision and inspect changed files
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/gpu_pr.py prepare

  approve:
    name: "Approve GPU for PR #${{ needs.prepare.outputs.pr_number }}"
    needs: prepare
    if: needs.prepare.outputs.mode == 'pr' && needs.prepare.outputs.needs_gpu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment:
      name: gpu-ci
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: GPU approval granted
        run: echo "Approved the pinned PR revision shown in the selection job summary."

  start-gpu:
    name: Revalidate revision and start HAI GPU
    needs: [prepare, approve]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.ready == 'true' &&
      (needs.prepare.outputs.mode == 'manual' ||
       (needs.prepare.outputs.mode == 'pr' && needs.prepare.outputs.needs_gpu == 'true' &&
        needs.approve.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 145
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    outputs:
      ready: ${{ steps.select.outputs.ready }}
      mode: ${{ steps.select.outputs.mode }}
      head_sha: ${{ steps.select.outputs.head_sha }}
      base_sha: ${{ steps.select.outputs.base_sha }}
      merge_sha: ${{ steps.select.outputs.merge_sha }}
      pr_number: ${{ steps.select.outputs.pr_number }}
      attempted: ${{ steps.power.outputs.attempted }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Revalidate approved revision before startup
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.prepare.outputs.merge_sha }}
          EXPECTED_PR: ${{ needs.prepare.outputs.pr_number }}
        run: python .github/scripts/gpu_pr.py select

      - name: Install Tencent Cloud SDK
        if: steps.select.outputs.ready == 'true'
        run: |
          python -m pip install \
            "tencentcloud-sdk-python-common==3.1.121" \
            "tencentcloud-sdk-python-hai==3.1.121"

      - name: Report pending GPU status
        if: steps.select.outputs.mode == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ steps.select.outputs.head_sha }}
        run: python .github/scripts/gpu_pr.py pending

      - name: Start instance and wait for runner
        id: power
        if: steps.select.outputs.ready == 'true'
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          HAI_REGION: ${{ vars.HAI_REGION }}
          HAI_INSTANCE_ID: ${{ vars.HAI_INSTANCE_ID }}
          HAI_RUNNER_NAME: ${{ vars.HAI_RUNNER_NAME }}
          GH_RUNNER_READ_TOKEN: ${{ secrets.GH_RUNNER_READ_TOKEN }}
        run: |
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          python -u .github/scripts/hai_power.py start

  gpu-tests:
    name: CuPy GPU tests
    needs: start-gpu
    if: needs.start-gpu.outputs.ready == 'true'
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      test_result: ${{ steps.tests.outcome }}
    env:
      CUDA_PATH: /usr/local/cuda-12.0

    steps:
      # Recheck with trusted code before fetching or installing any PR code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Recheck revision after waiting for GPU
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ needs.start-gpu.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.start-gpu.outputs.base_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.start-gpu.outputs.merge_sha }}
          EXPECTED_PR: ${{ needs.start-gpu.outputs.pr_number }}
        run: '"$HOME/fatqat-ci-venv/bin/python" .github/scripts/gpu_pr.py select'

      - name: Check out selected PR merge commit
        if: steps.current.outputs.ready == 'true' && needs.start-gpu.outputs.mode == 'pr'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.start-gpu.outputs.merge_sha }}
          fetch-depth: 2
          # Maintainer-reviewed opt-in on a persistent runner; not security isolation.
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Verify fetched commit and install tested FATQAT
        if: steps.current.outputs.ready == 'true' && needs.start-gpu.outputs.mode == 'pr'
        env:
          PR_HEAD_SHA: ${{ needs.start-gpu.outputs.head_sha }}
          BASE_SHA: ${{ needs.start-gpu.outputs.base_sha }}
          MERGE_SHA: ${{ needs.start-gpu.outputs.merge_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git show -s --format=%P HEAD)" = "$BASE_SHA $PR_HEAD_SHA"
          export PATH="$CUDA_PATH/bin:$PATH"
          export LD_LIBRARY_PATH="$CUDA_PATH/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          TEST_ENV="$RUNNER_TEMP/fatqat-gpu-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          "$HOME/fatqat-ci-venv/bin/python" -m venv "$TEST_ENV"
          "$TEST_ENV/bin/python" -m pip install --upgrade "pip>=25.1"
          "$TEST_ENV/bin/python" -m pip install . --group test-full "cupy-cuda12x==13.6.0"
          echo "GPU_PYTHON=$TEST_ENV/bin/python" >> "$GITHUB_ENV"

      - name: Verify CUDA before pytest
        if: steps.current.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$CUDA_PATH/bin:$PATH"
          export LD_LIBRARY_PATH="$CUDA_PATH/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          PYTHON="${GPU_PYTHON:-$HOME/fatqat-ci-venv/bin/python}"

          "$PYTHON" --version
          nvidia-smi

          "$PYTHON" -I - <<'PY'
          import cupy as cp

          cp.show_config()
          device_count = cp.cuda.runtime.getDeviceCount()
          if device_count < 1:
              raise RuntimeError("GPU CI requires an available CUDA GPU")

          with cp.cuda.Device(0):
              probe = cp.asarray([1.0, 2.0, 3.0], dtype=cp.float32)
              result_gpu = probe + 1.0
              cp.cuda.get_current_stream().synchronize()
              result = result_gpu.get().tolist()

          if result != [2.0, 3.0, 4.0]:
              raise RuntimeError(f"CUDA preflight returned an incorrect result: {result}")

          print(f"CUDA_PREFLIGHT_PASSED: {device_count} device(s)")
          PY

      - name: Run GPU tests only
        id: tests
        if: steps.current.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$CUDA_PATH/bin:$PATH"
          export LD_LIBRARY_PATH="$CUDA_PATH/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          PYTHON="${GPU_PYTHON:-$HOME/fatqat-ci-venv/bin/python}"

          "$PYTHON" -m pytest tests/gpu_tests --confcutdir=tests/gpu_tests -v -rs

  stop-gpu:
    name: Stop HAI GPU
    needs: [start-gpu, gpu-tests]
    if: ${{ always() && needs.start-gpu.outputs.attempted == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Tencent Cloud SDK
        run: |
          python -m pip install \
            "tencentcloud-sdk-python-common==3.1.121" \
            "tencentcloud-sdk-python-hai==3.1.121"

      - name: Stop GPU and verify state
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          HAI_REGION: ${{ vars.HAI_REGION }}
          HAI_INSTANCE_ID: ${{ vars.HAI_INSTANCE_ID }}
        run: python -u .github/scripts/hai_power.py stop

  report:
    name: Report PR commit status
    needs: [prepare, start-gpu, gpu-tests, stop-gpu]
    if: ${{ always() && needs.prepare.outputs.mode == 'pr' && needs.prepare.outputs.needs_gpu == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Report tests and shutdown result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          START_RESULT: ${{ needs.start-gpu.result }}
          GPU_JOB_RESULT: ${{ needs.gpu-tests.result }}
          TEST_RESULT: ${{ needs.gpu-tests.outputs.test_result }}
          STOP_RESULT: ${{ needs.stop-gpu.result }}
        run: python .github/scripts/gpu_pr.py report
