name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            groups: "--group draw"
          - os: windows-latest
            python-version: "3.13"
            groups: ""
          - os: macos-latest
            python-version: "3.14"
            groups: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run tests
        run: uv run ${{ matrix.groups }} pytest

      - name: Run doctests
        run: uv run ${{ matrix.groups }} pytest --doctest-modules src/fatqat
