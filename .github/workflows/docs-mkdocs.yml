name: MkDocs documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Strict bilingual build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/mkdocs/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r docs/mkdocs/requirements.txt

      - name: Verify generated output is not tracked
        run: |
          tracked_generated="$(git ls-files -- \
            docs/mkdocs/en/assets/generated \
            docs/mkdocs/zh/assets/generated \
            docs/mkdocs/en/downloads/tutorials \
            docs/mkdocs/zh/downloads/tutorials \
            docs/mkdocs/en/tutorials \
            docs/mkdocs/zh/tutorials \
            docs/mkdocs/tutorial-results)"
          if [ -n "$tracked_generated" ]; then
            printf 'Generated documentation files must not be tracked:\n%s\n' "$tracked_generated"
            exit 1
          fi

      - name: Build English and Chinese documentation
        run: python docs/mkdocs/manage.py build

      - name: Verify the build did not modify sources
        run: git diff --exit-code

      - name: Upload static-site artifact
        uses: actions/upload-artifact@v6
        with:
          name: fatqat-mkdocs-site
          path: docs/mkdocs/site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
