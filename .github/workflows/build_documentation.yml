name: Build HTML documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build documentation
        run: uv run sphinx-build -b html -W --keep-going -T docs/sphinx docs/sphinx/_build

      # The test job already runs doctests, but through pytest with
      # scipy-doctest, which compares floats with a tolerance. Sphinx's own
      # doctest builder compares the printed text exactly, so an example whose
      # last bit of rounding drifts passes there and fails here. Running both
      # is the point: whichever runner a contributor reaches for, the examples
      # they read in the docs are the ones that were checked.
      - name: Run doctests as the docs build sees them
        run: uv run sphinx-build -b doctest -T docs/sphinx docs/sphinx/_doctest

      - name: Upload built files
        uses: actions/upload-artifact@v7
        with:
          name: fatqat_html_docs
          path: docs/sphinx/_build/*
          if-no-files-found: error
