name: Build and optionally publish to PyPI

on:
  workflow_dispatch:
    inputs:
      confirm_ref:
        description: Type the selected branch or tag name to publish (leave blank to build only)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Verify publishing request
        if: inputs.confirm_ref != ''
        env:
          CONFIRM_REF: ${{ inputs.confirm_ref }}
          RELEASE_REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python -m pip install --no-deps dist/*.whl
          python - <<'PY'
          import os
          from importlib.metadata import version
          from packaging.version import Version

          if os.environ["CONFIRM_REF"] != os.environ["RELEASE_REF"]:
              raise SystemExit("Confirmation must exactly match the selected branch or tag.")

          release = Version(version("fatqat"))
          if release.is_devrelease or release.local is not None:
              raise SystemExit("Development and local versions cannot be published to PyPI.")
          if os.environ["REF_TYPE"] == "tag" and os.environ["RELEASE_REF"] != f"v{release}":
              raise SystemExit("Tag and package version differ.")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: inputs.confirm_ref != '' && github.repository == 'spaceqat/fatqat'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
