version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    build:
      html:
        - python docs/mkdocs/manage.py build --site-dir "$READTHEDOCS_OUTPUT/html" --site-url "$READTHEDOCS_CANONICAL_URL"

# The built-in MkDocs builder accepts one configuration. FatQat uses a custom
# build job so the English and Chinese configurations share one published site.
mkdocs:
  configuration: docs/mkdocs/mkdocs.en.yml
  fail_on_warning: true

python:
  install:
    - requirements: docs/mkdocs/requirements.txt
    - method: pip
      path: .
