version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      # Keep tutorial execution separate; MkDocs reuses this build's results.
      - python docs/mkdocs/tools/build_tutorials.py --execute

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: docs/mkdocs/requirements.txt
    - method: pip
      path: .
